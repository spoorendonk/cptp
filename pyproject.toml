[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "cptp"
version = "0.1.0"
description = "Branch-and-cut solver for the Capacitated Profitable Tour Problem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy"]

# `uv sync` installs these, so the pre-commit hook's ruff and mypy checks run.
# clang-format and clang-tidy are pinned exactly, to the group's one toolchain
# version (#83, also in `.clang-format-version`): their output and findings
# change between releases. The hooks and cmake/Lint.cmake look in .venv/bin
# first, so the gate is the same whatever the host has installed.
[dependency-groups]
dev = [
    "clang-format==22.1.8",
    "clang-tidy==22.1.8",
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.17",
]

[project.urls]
Repository = "https://github.com/spoorendonk/cptp"

[project.scripts]
cptp = "cptp.__main__:main"

[tool.scikit-build]
cmake.args = ["-DCPTP_BUILD_PYTHON=ON", "-DCPTP_BUILD_TESTS=OFF"]
cmake.version = ">=3.25"
cmake.build-type = "Release"
wheel.packages = ["python/cptp"]

[tool.ruff]
line-length = 100
target-version = "py312"
output-format = "concise"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C901", # mccabe complexity
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
pretty = false
show_error_context = false
show_column_numbers = true
error_summary = true
# Build trees (`build*/`, ignored by git) hold fetched dependencies' Python.
exclude = ["^build[^/]*/"]

# The nanobind extension ships no stubs, so its names are Any to mypy.
[[tool.mypy.overrides]]
module = "cptp._cptp"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --tb=short --no-header"
